<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Sign up — CloudCart</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%98%81%EF%B8%8F%3C/text%3E%3C/svg%3E"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/styles.css"/>
</head>
<body>
  <div id="site-header"></div>

  <main class="auth-wrap">
    <div class="auth-card">
      <div class="glyph">🚀</div>
      <h1>Create your account</h1>
      <p class="sub">Sign up to track orders and view your personal dashboard.</p>

      <div class="form-error" id="form-error"></div>

      <form id="signup-form">
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" autocomplete="name" required placeholder="Jordan Lee"/>
        </div>
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" autocomplete="email" required placeholder="you@example.com"/>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="field-input-wrap">
            <input type="password" id="password" autocomplete="new-password" required placeholder="At least 6 characters"/>
            <button type="button" class="pass-toggle" id="pass-toggle" aria-label="Show password">👁️</button>
          </div>
          <div class="strength-meter" id="strength-meter"><i></i><i></i><i></i></div>
          <span class="strength-label" id="strength-label">Use 6+ characters. Stored as a bcrypt hash, never in plain text.</span>
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="submit-btn">Create account</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="/login">Log in</a></p>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/signup.js"></script>
</body>
</html>
