apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cloudcart
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: frontend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:

            - name: PRODUCT_SERVICE_URL
              value: "http://product-service"
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory-service"
            - name: CART_SERVICE_URL
              value: "http://cart-service"
            - name: ORDER_SERVICE_URL
              value: "http://order-service"
            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service"

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
