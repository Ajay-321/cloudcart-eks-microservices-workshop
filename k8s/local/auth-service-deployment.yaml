# ---------------------------------------------------------------------------
# Deployment: auth-service (LOCAL / in-memory mode, USE_DYNAMODB=false)
#
# Handles signup/login and issues JWTs. Same self-healing Deployment pattern
# as every other CloudCart service.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: cloudcart
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          # Local image tag; on kind/minikube load this image into the cluster first.
          image: auth-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: USE_DYNAMODB      # "false" => use in-memory users map, no AWS needed
              value: "false"
            - name: AWS_REGION
              value: "us-east-1"
            - name: JWT_SECRET        # demo secret; override with a Kubernetes Secret in real use
              value: "cloudcart-dev-secret-change-me"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
