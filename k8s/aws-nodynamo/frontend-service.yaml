# ---------------------------------------------------------------------------
# Service: frontend (type LoadBalancer)
#
# On EKS, type=LoadBalancer tells the AWS cloud controller to provision a real
# AWS load balancer (Classic/Network LB by default) with a public DNS name.
# That public address is how the app is reached from a browser:
#   kubectl get svc frontend -n cloudcart   # copy EXTERNAL-IP (the ELB hostname)
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: cloudcart
spec:
  type: LoadBalancer
  selector:
    app: frontend             # routes to the frontend Pods
  ports:
    - port: 80                # public port on the load balancer
      targetPort: 3000        # container port
