apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: cloudcart
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/cloudcart-auth-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:

            # In-memory mode: no DynamoDB, no service account, no table needed.
            - name: USE_DYNAMODB
              value: "false"
            - name: AWS_REGION
              value: "us-east-1"

            # Demo secret. For a real deployment, put this in a Kubernetes
            # Secret (or AWS Secrets Manager) instead of a plain env value.
            - name: JWT_SECRET
              value: "cloudcart-dev-secret-change-me"

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
