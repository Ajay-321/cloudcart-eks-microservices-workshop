apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: cloudcart
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/cloudcart-order-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:

            # In-memory mode: no DynamoDB, no service account, no table needed.
            - name: USE_DYNAMODB
              value: "false"
            - name: AWS_REGION
              value: "us-east-1"

            - name: INVENTORY_SERVICE_URL
              value: "http://inventory-service"
            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service"

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
