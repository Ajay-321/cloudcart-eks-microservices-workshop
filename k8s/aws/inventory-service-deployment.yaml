apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: cloudcart
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      serviceAccountName: cloudcart-dynamodb
      containers:
        - name: inventory-service
          image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/cloudcart-inventory-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:

            - name: USE_DYNAMODB
              value: "true"
            - name: AWS_REGION
              value: "us-east-1"

            - name: DYNAMODB_TABLE
              value: "cloudcart-inventory"

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
