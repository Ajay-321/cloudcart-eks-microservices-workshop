# A ServiceAccount is the identity a Pod uses inside the cluster.
# In the AWS/DynamoDB phase we associate this ServiceAccount with an IAM role
# using EKS Pod Identity (see eks/pod-identity.md). Any Pod that sets
#   spec.serviceAccountName: cloudcart-dynamodb
# then receives temporary AWS credentials automatically — NO access keys in YAML.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudcart-dynamodb
  namespace: cloudcart
