# =============================================================================
# CloudCart — APPLICATION deployment pipeline  (DISABLED by default)
#
# This is the OPTIONAL "finale" workflow. It automates the app deployment that
# you otherwise do by hand:
#   1. build the six Docker images
#   2. push them to Amazon ECR
#   3. point kubectl at the EKS cluster
#   4. kubectl apply the manifests in k8s/aws/
#
# It is commented out on purpose. The app deploy is intentionally a manual step
# by default; enable this workflow when you want the build/push/apply to run in
# CI instead.
#
# ----------------------------------------------------------------------------
# TO ENABLE:
#   1. Uncomment everything below.
#   2. Make sure these repo secrets exist:
#        AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   3. The IAM user behind those keys MUST have kubectl access to the cluster.
#      Terraform way: add that user to `access_entries` in terraform.tfvars, e.g.
#        access_entries = {
#          ci = {
#            principal_arn = "arn:aws:iam::689351349581:user/<ci-user>"
#            policy_arn    = "arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy"
#            access_scope  = "cluster"
#          }
#        }
#   4. The EKS cluster and ECR repos must already exist (run the Terraform
#      workflow first).
