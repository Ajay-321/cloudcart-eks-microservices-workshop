<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="820" viewBox="0 0 1480 820">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1480" height="820" fill="#f7f8fc"/>

  <!-- Title -->
  <text x="740" y="44" font-family="Arial" font-size="30" font-weight="bold" fill="#1a1a2e" text-anchor="middle">CloudCart — End-to-End Architecture (Terraform → GitHub Actions → EKS → LoadBalancer → UI)</text>
  <text x="740" y="72" font-family="Arial" font-size="18" fill="#1a1a2e" text-anchor="middle">Region: us-east-1</text>

  <!-- ===================== PIPELINE STAGES (top row) ===================== -->
  <!-- Terraform (IaC) -->
  <rect x="40" y="100" width="300" height="150" rx="18" fill="#e9efff" stroke="#4056a1" stroke-width="3"/>
  <text x="190" y="132" font-family="Arial" font-size="21" font-weight="bold" fill="#4056a1" text-anchor="middle">Terraform (IaC)</text>
  <text x="190" y="160" font-family="Arial" font-size="14" fill="#1a1a2e" text-anchor="middle">environments/dev/us-east-1</text>
  <text x="190" y="180" font-family="Arial" font-size="14" fill="#1a1a2e" text-anchor="middle">edit terraform.tfvars</text>
  <text x="190" y="202" font-family="Arial" font-size="14" fill="#1a1a2e" text-anchor="middle">Remote state in S3</text>
  <text x="190" y="228" font-family="Arial" font-size="13" fill="#1a1a2e" text-anchor="middle">modules: vpc, eks, ecr, dynamodb,</text>
  <text x="190" y="244" font-family="Arial" font-size="13" fill="#1a1a2e" text-anchor="middle">kms, eks-pod-identity</text>

  <!-- GitHub Actions (CI/CD) -->
  <rect x="400" y="100" width="330" height="150" rx="18" fill="#efe9ff" stroke="#6a4c93" stroke-width="3"/>
  <text x="565" y="132" font-family="Arial" font-size="21" font-weight="bold" fill="#6a4c93" text-anchor="middle">GitHub Actions</text>
  <text x="565" y="160" font-family="Arial" font-size="14" fill="#1a1a2e" text-anchor="middle">terraform plan on push</text>
  <text x="565" y="182" font-family="Arial" font-size="14" fill="#1a1a2e" text-anchor="middle">terraform apply on main branch</text>
  <text x="565" y="212" font-family="Arial" font-size="13" font-weight="bold" fill="#6a4c93" text-anchor="middle">App deploy (ECR push + kubectl apply)</text>
  <text x="565" y="230" font-family="Arial" font-size="13" font-weight="bold" fill="#6a4c93" text-anchor="middle">is a SEPARATE step</text>

  <!-- AWS provisioning summary card -->
  <rect x="790" y="100" width="440" height="150" rx="18" fill="#fff4e0" stroke="#e08e0b" stroke-width="3"/>
  <text x="1010" y="132" font-family="Arial" font-size="21" font-weight="bold" fill="#e08e0b" text-anchor="middle">AWS Infrastructure</text>
  <text x="1010" y="162" font-family="Arial" font-size="15" fill="#1a1a2e" text-anchor="middle">Terraform provisions VPC, EKS, ECR,</text>
  <text x="1010" y="184" font-family="Arial" font-size="15" fill="#1a1a2e" text-anchor="middle">DynamoDB, KMS, and EKS Pod Identity</text>
  <text x="1010" y="212" font-family="Arial" font-size="14" font-style="italic" fill="#1a1a2e" text-anchor="middle">detailed in the AWS box below</text>

  <!-- Stage arrows -->
  <line x1="340" y1="175" x2="398" y2="175" stroke="#1a1a2e" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="175" x2="788" y2="175" stroke="#1a1a2e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="759" y="165" font-family="Arial" font-size="13" fill="#1a1a2e" text-anchor="middle">provisions</text>

  <!-- arrow down into AWS container -->
  <line x1="1010" y1="250" x2="1010" y2="288" stroke="#1a1a2e" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ===================== USER ACCESS PATH (far-left strip) ===================== -->
  <text x="140" y="312" font-family="Arial" font-size="16" font-weight="bold" fill="#1a1a2e" text-anchor="middle">User access path</text>

  <!-- Browser -->
  <rect x="40" y="330" width="200" height="80" rx="16" fill="#ffffff" stroke="#4056a1" stroke-width="3"/>
  <text x="140" y="366" font-family="Arial" font-size="18" font-weight="bold" fill="#4056a1" text-anchor="middle">Browser (User)</text>
  <text x="140" y="390" font-family="Arial" font-size="13" fill="#1a1a2e" text-anchor="middle">HTTPS request</text>

  <!-- LoadBalancer -->
  <rect x="40" y="450" width="200" height="100" rx="16" fill="#fff4e0" stroke="#e08e0b" stroke-width="3"/>
  <text x="140" y="484" font-family="Arial" font-size="16" font-weight="bold" fill="#e08e0b" text-anchor="middle">AWS Elastic</text>
  <text x="140" y="506" font-family="Arial" font-size="16" font-weight="bold" fill="#e08e0b" text-anchor="middle">Load Balancer</text>
  <text x="140" y="530" font-family="Arial" font-size="13" fill="#1a1a2e" text-anchor="middle">public DNS</text>

  <!-- frontend Service -->
  <rect x="40" y="590" width="200" height="100" rx="16" fill="#eef8ef" stroke="#4b8c5a" stroke-width="3"/>
  <text x="140" y="624" font-family="Arial" font-size="16" font-weight="bold" fill="#4b8c5a" text-anchor="middle">Service: frontend</text>
  <text x="140" y="648" font-family="Arial" font-size="14" fill="#1a1a2e" text-anchor="middle">(type: LoadBalancer)</text>
  <text x="140" y="672" font-family="Arial" font-size="13" fill="#1a1a2e" text-anchor="middle">→ frontend Pods</text>

  <!-- Browser -> LoadBalancer -->
  <line x1="140" y1="410" x2="140" y2="448" stroke="#1a1a2e" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- LoadBalancer -> frontend Service -->
  <line x1="140" y1="550" x2="140" y2="588" stroke="#1a1a2e" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ===================== AWS INFRASTRUCTURE CONTAINER ===================== -->
  <rect x="280" y="290" width="1170" height="490" rx="24" fill="#fff4e0" stroke="#e08e0b" stroke-width="3"/>
  <text x="308" y="322" font-family="Arial" font-size="23" font-weight="bold" fill="#e08e0b">AWS — us-east-1</text>

  <!-- Right-side AWS services column -->
  <!-- Amazon ECR -->
  <rect x="1140" y="336" width="290" height="86" rx="16" fill="#ffffff" stroke="#e08e0b" stroke-width="2"/>
  <text x="1285" y="364" font-family="Arial" font-size="18" font-weight="bold" fill="#e08e0b" text-anchor="middle">Amazon ECR</text>
  <text x="1285" y="388" font-family="Arial" font-size="13" fill="#1a1a2e" text-anchor="middle">container images:</text>
  <text x="1285" y="406" font-family="Arial" font-size="13" fill="#1a1a2e" text-anchor="middle">cloudcart-*</text>

  <!-- Amazon DynamoDB -->
  <rect x="1140" y="436" width="290" height="106" rx="16" fill="#ffffff" stroke="#e08e0b" stroke-width="2"/>
  <text x="1285" y="464" font-family="Arial" font-size="18" font-weight="bold" fill="#e08e0b" text-anchor="middle">Amazon DynamoDB</text>
  <text x="1285" y="490" font-family="Arial" font-size="13" fill="#1a1a2e" text-anchor="middle">5 tables: products, inventory,</text>
  <text x="1285" y="508" font-family="Arial" font-size="13" fill="#1a1a2e" text-anchor="middle">carts, orders, users/payments</text>

  <!-- AWS KMS -->
  <rect x="1140" y="556" width="290" height="80" rx="16" fill="#ffffff" stroke="#e08e0b" stroke-width="2"/>
  <text x="1285" y="586" font-family="Arial" font-size="18" font-weight="bold" fill="#e08e0b" text-anchor="middle">AWS KMS</text>
  <text x="1285" y="610" font-family="Arial" font-size="14" fill="#1a1a2e" text-anchor="middle">encryption</text>

  <!-- EKS Pod Identity -->
  <rect x="1140" y="650" width="290" height="100" rx="16" fill="#ffffff" stroke="#e08e0b" stroke-width="2"/>
  <text x="1285" y="678" font-family="Arial" font-size="17" font-weight="bold" fill="#e08e0b" text-anchor="middle">EKS Pod Identity</text>
  <text x="1285" y="702" font-family="Arial" font-size="13" fill="#1a1a2e" text-anchor="middle">scoped IAM role</text>
  <text x="1285" y="722" font-family="Arial" font-size="13" fill="#1a1a2e" text-anchor="middle">NO access keys in Kubernetes</text>

  <!-- ===================== VPC BOUNDARY ===================== -->
  <rect x="300" y="336" width="820" height="424" rx="20" fill="none" stroke="#e08e0b" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="320" y="360" font-family="Arial" font-size="17" font-weight="bold" fill="#e08e0b">VPC</text>

  <!-- ===================== EKS CLUSTER ===================== -->
  <rect x="320" y="372" width="782" height="372" rx="18" fill="#eef8ef" stroke="#4b8c5a" stroke-width="3"/>
  <text x="338" y="398" font-family="Arial" font-size="20" font-weight="bold" fill="#4b8c5a">EKS Cluster</text>

  <!-- Control Plane -->
  <rect x="338" y="410" width="378" height="60" rx="14" fill="#ffffff" stroke="#4b8c5a" stroke-width="2"/>
  <text x="527" y="432" font-family="Arial" font-size="15" font-weight="bold" fill="#4b8c5a" text-anchor="middle">Control Plane</text>
  <text x="527" y="454" font-family="Arial" font-size="12" fill="#1a1a2e" text-anchor="middle">API Server • Scheduler • Controllers • etcd</text>

  <!-- Managed Node Group header card -->
  <rect x="726" y="410" width="360" height="60" rx="14" fill="#ffffff" stroke="#4b8c5a" stroke-width="2"/>
  <text x="906" y="432" font-family="Arial" font-size="15" font-weight="bold" fill="#4b8c5a" text-anchor="middle">Managed Node Group</text>
  <text x="906" y="454" font-family="Arial" font-size="12" fill="#1a1a2e" text-anchor="middle">t3.medium • 2–4 nodes • Kubernetes v1.31</text>

  <!-- namespace: cloudcart region -->
  <rect x="338" y="484" width="748" height="248" rx="16" fill="#ffffff" stroke="#4b8c5a" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="356" y="506" font-family="Arial" font-size="14" font-weight="bold" fill="#4b8c5a">namespace: cloudcart  (Managed Node Group pods)</text>

  <!-- frontend pod -->
  <rect x="356" y="524" width="150" height="180" rx="14" fill="#eef8ef" stroke="#4b8c5a" stroke-width="2"/>
  <text x="431" y="556" font-family="Arial" font-size="16" font-weight="bold" fill="#4b8c5a" text-anchor="middle">frontend</text>
  <text x="431" y="578" font-family="Arial" font-size="12" fill="#1a1a2e" text-anchor="middle">Pods</text>
  <text x="431" y="620" font-family="Arial" font-size="11" fill="#1a1a2e" text-anchor="middle">routes /api to</text>
  <text x="431" y="636" font-family="Arial" font-size="11" fill="#1a1a2e" text-anchor="middle">backend services</text>

  <!-- backend column 1 -->
  <!-- product-service -->
  <rect x="560" y="524" width="176" height="52" rx="12" fill="#eef8ef" stroke="#4b8c5a" stroke-width="2"/>
  <text x="648" y="556" font-family="Arial" font-size="14" font-weight="bold" fill="#4b8c5a" text-anchor="middle">product-service</text>
  <!-- inventory-service -->
  <rect x="560" y="588" width="176" height="52" rx="12" fill="#eef8ef" stroke="#4b8c5a" stroke-width="2"/>
  <text x="648" y="620" font-family="Arial" font-size="14" font-weight="bold" fill="#4b8c5a" text-anchor="middle">inventory-service</text>
  <!-- cart-service -->
  <rect x="560" y="652" width="176" height="52" rx="12" fill="#eef8ef" stroke="#4b8c5a" stroke-width="2"/>
  <text x="648" y="684" font-family="Arial" font-size="14" font-weight="bold" fill="#4b8c5a" text-anchor="middle">cart-service</text>

  <!-- backend column 2 -->
  <!-- order-service -->
  <rect x="786" y="524" width="176" height="52" rx="12" fill="#eef8ef" stroke="#4b8c5a" stroke-width="2"/>
  <text x="874" y="556" font-family="Arial" font-size="14" font-weight="bold" fill="#4b8c5a" text-anchor="middle">order-service</text>
  <!-- auth-service -->
  <rect x="786" y="588" width="176" height="52" rx="12" fill="#eef8ef" stroke="#4b8c5a" stroke-width="2"/>
  <text x="874" y="620" font-family="Arial" font-size="14" font-weight="bold" fill="#4b8c5a" text-anchor="middle">auth-service</text>
  <!-- payment-service -->
  <rect x="786" y="652" width="176" height="52" rx="12" fill="#eef8ef" stroke="#4b8c5a" stroke-width="2"/>
  <text x="874" y="684" font-family="Arial" font-size="14" font-weight="bold" fill="#4b8c5a" text-anchor="middle">payment-service</text>

  <!-- frontend Service -> frontend Pods (crosses from left strip into cluster) -->
  <line x1="240" y1="640" x2="354" y2="614" stroke="#1a1a2e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="300" y="600" font-family="Arial" font-size="11" font-weight="bold" fill="#1a1a2e" text-anchor="middle">to Pods</text>

  <!-- frontend routes /api to backend services -->
  <line x1="506" y1="576" x2="558" y2="550" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="506" y1="600" x2="558" y2="612" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="506" y1="628" x2="558" y2="676" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="506" y1="560" x2="784" y2="550" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="506" y1="588" x2="784" y2="612" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="533" y="516" font-family="Arial" font-size="12" font-weight="bold" fill="#1a1a2e" text-anchor="middle">/api</text>

  <!-- order-service -> inventory-service -->
  <line x1="786" y1="560" x2="738" y2="600" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="770" y="588" font-family="Arial" font-size="11" fill="#1a1a2e" text-anchor="middle">reserve</text>

  <!-- order-service -> payment-service -->
  <line x1="874" y1="576" x2="874" y2="650" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="916" y="628" font-family="Arial" font-size="11" fill="#1a1a2e" text-anchor="middle">charge</text>

  <!-- ECR -> pods (pull images) -->
  <line x1="1140" y1="392" x2="988" y2="522" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1064" y="450" font-family="Arial" font-size="12" font-weight="bold" fill="#1a1a2e" text-anchor="middle">pull images</text>

  <!-- pods -> DynamoDB via Pod Identity -->
  <line x1="964" y1="612" x2="1138" y2="500" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1055" y="590" font-family="Arial" font-size="12" font-weight="bold" fill="#1a1a2e" text-anchor="middle">via Pod Identity</text>
  <text x="1055" y="606" font-family="Arial" font-size="12" font-weight="bold" fill="#1a1a2e" text-anchor="middle">(no keys)</text>

</svg>
