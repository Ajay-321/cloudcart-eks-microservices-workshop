<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5b6472"/>
    </marker>
  </defs>

  <!-- Slide background -->
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="1280" height="90" fill="#0f1b3d"/>
  <text x="48" y="56" font-family="Arial" font-size="30" font-weight="bold" fill="#ffffff">Kubernetes architecture — control plane + nodes</text>
  <text x="1232" y="54" font-family="Arial" font-size="16" fill="#9fb3d1" text-anchor="end">CloudCart Workshop</text>

  <!-- Big cluster container -->
  <rect x="48" y="115" width="850" height="470" rx="18" fill="#e8effd" stroke="#326ce5" stroke-width="3"/>
  <text x="70" y="150" font-family="Arial" font-size="22" font-weight="bold" fill="#326ce5">Kubernetes Cluster</text>

  <!-- Control Plane region -->
  <text x="70" y="185" font-family="Arial" font-size="18" font-weight="bold" fill="#0f1b3d">Control Plane (the brain)</text>

  <!-- API Server -->
  <rect x="70" y="200" width="190" height="90" rx="12" fill="#ffffff" stroke="#c7ced9" stroke-width="2"/>
  <text x="165" y="238" font-family="Arial" font-size="17" font-weight="bold" fill="#1a1a2e" text-anchor="middle">API Server</text>
  <text x="165" y="262" font-family="Arial" font-size="13" fill="#5b6472" text-anchor="middle">front door</text>

  <!-- Scheduler -->
  <rect x="280" y="200" width="190" height="90" rx="12" fill="#ffffff" stroke="#c7ced9" stroke-width="2"/>
  <text x="375" y="238" font-family="Arial" font-size="17" font-weight="bold" fill="#1a1a2e" text-anchor="middle">Scheduler</text>
  <text x="375" y="262" font-family="Arial" font-size="13" fill="#5b6472" text-anchor="middle">places Pods</text>

  <!-- Controllers -->
  <rect x="490" y="200" width="190" height="90" rx="12" fill="#ffffff" stroke="#c7ced9" stroke-width="2"/>
  <text x="585" y="238" font-family="Arial" font-size="17" font-weight="bold" fill="#1a1a2e" text-anchor="middle">Controllers</text>
  <text x="585" y="262" font-family="Arial" font-size="13" fill="#5b6472" text-anchor="middle">keep desired state</text>

  <!-- etcd -->
  <rect x="700" y="200" width="175" height="90" rx="12" fill="#ffffff" stroke="#c7ced9" stroke-width="2"/>
  <text x="787" y="238" font-family="Arial" font-size="17" font-weight="bold" fill="#1a1a2e" text-anchor="middle">etcd</text>
  <text x="787" y="262" font-family="Arial" font-size="13" fill="#5b6472" text-anchor="middle">cluster data store</text>

  <!-- Arrow down to worker nodes -->
  <line x1="470" y1="290" x2="470" y2="360" stroke="#5b6472" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="485" y="332" font-family="Arial" font-size="15" fill="#5b6472">schedules &amp; manages</text>

  <!-- Worker Nodes region -->
  <text x="70" y="385" font-family="Arial" font-size="18" font-weight="bold" fill="#0f1b3d">Worker Nodes (the muscle)</text>

  <!-- Node 1 -->
  <rect x="70" y="400" width="385" height="165" rx="12" fill="#eef8ef" stroke="#4b8c5a" stroke-width="2.5"/>
  <text x="90" y="430" font-family="Arial" font-size="17" font-weight="bold" fill="#1a1a2e">Node</text>
  <text x="90" y="455" font-family="Arial" font-size="14" fill="#5b6472">kubelet</text>
  <rect x="90" y="470" width="150" height="75" rx="10" fill="#ffffff" stroke="#c7ced9" stroke-width="2"/>
  <text x="165" y="513" font-family="Arial" font-size="15" font-weight="bold" fill="#1a1a2e" text-anchor="middle">Pod</text>
  <rect x="260" y="470" width="150" height="75" rx="10" fill="#ffffff" stroke="#c7ced9" stroke-width="2"/>
  <text x="335" y="513" font-family="Arial" font-size="15" font-weight="bold" fill="#1a1a2e" text-anchor="middle">Pod</text>

  <!-- Node 2 -->
  <rect x="475" y="400" width="385" height="165" rx="12" fill="#eef8ef" stroke="#4b8c5a" stroke-width="2.5"/>
  <text x="495" y="430" font-family="Arial" font-size="17" font-weight="bold" fill="#1a1a2e">Node</text>
  <text x="495" y="455" font-family="Arial" font-size="14" fill="#5b6472">kubelet</text>
  <rect x="495" y="470" width="150" height="75" rx="10" fill="#ffffff" stroke="#c7ced9" stroke-width="2"/>
  <text x="570" y="513" font-family="Arial" font-size="15" font-weight="bold" fill="#1a1a2e" text-anchor="middle">Pod</text>
  <rect x="665" y="470" width="150" height="75" rx="10" fill="#ffffff" stroke="#c7ced9" stroke-width="2"/>
  <text x="740" y="513" font-family="Arial" font-size="15" font-weight="bold" fill="#1a1a2e" text-anchor="middle">Pod</text>

  <!-- Right legend/callout box -->
  <rect x="920" y="115" width="312" height="470" rx="16" fill="#ffffff" stroke="#c7ced9" stroke-width="2.5"/>
  <text x="1076" y="155" font-family="Arial" font-size="20" font-weight="bold" fill="#0f1b3d" text-anchor="middle">Objects</text>
  <line x1="945" y1="175" x2="1207" y2="175" stroke="#d9dee8" stroke-width="1.5"/>

  <text x="945" y="230" font-family="Arial" font-size="16" font-weight="bold" fill="#326ce5">Pod</text>
  <text x="945" y="255" font-family="Arial" font-size="14" fill="#5b6472">smallest unit (containers)</text>

  <text x="945" y="315" font-family="Arial" font-size="16" font-weight="bold" fill="#326ce5">Deployment</text>
  <text x="945" y="340" font-family="Arial" font-size="14" fill="#5b6472">replicas + rollouts</text>

  <text x="945" y="400" font-family="Arial" font-size="16" font-weight="bold" fill="#326ce5">Service</text>
  <text x="945" y="425" font-family="Arial" font-size="14" fill="#5b6472">stable networking</text>

  <text x="945" y="485" font-family="Arial" font-size="16" font-weight="bold" fill="#326ce5">Namespace</text>
  <text x="945" y="510" font-family="Arial" font-size="14" fill="#5b6472">grouping</text>

  <!-- Caption -->
  <text x="640" y="640" font-family="Arial" font-size="17" font-style="italic" fill="#5b6472" text-anchor="middle">You declare desired state via the API Server; controllers make the cluster match it.</text>

  <!-- Footer -->
  <line x1="48" y1="684" x2="1232" y2="684" stroke="#d9dee8" stroke-width="1"/>
  <text x="48" y="706" font-family="Arial" font-size="13" fill="#6b7280">CloudCart — Kubernetes &amp; Amazon EKS Workshop</text>
  <text x="1232" y="706" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="end">5 / 8</text>
</svg>
