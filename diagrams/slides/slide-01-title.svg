<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5b6472"/>
    </marker>
  </defs>

  <!-- Slide background -->
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="1280" height="90" fill="#0f1b3d"/>
  <text x="48" y="56" font-family="Arial" font-size="30" font-weight="bold" fill="#ffffff">CloudCart — EKS Workshop</text>
  <text x="1232" y="54" font-family="Arial" font-size="16" fill="#9fb3d1" text-anchor="end">CloudCart Workshop</text>

  <!-- Body: centered title -->
  <text x="640" y="250" font-family="Arial" font-size="36" font-weight="bold" fill="#0f1b3d" text-anchor="middle">Deploying Microservices on AWS</text>
  <text x="640" y="300" font-family="Arial" font-size="36" font-weight="bold" fill="#0f1b3d" text-anchor="middle">Managed Kubernetes (EKS)</text>

  <!-- Subtitle -->
  <text x="640" y="360" font-family="Arial" font-size="24" fill="#5b6472" text-anchor="middle">From a container on your laptop → Amazon EKS → live app</text>

  <!-- Journey strip: 5 pills with arrows -->
  <!-- Pill 1: Docker (k8s-blue) -->
  <rect x="120" y="470" width="150" height="64" rx="14" fill="#e8effd" stroke="#326ce5" stroke-width="2.5"/>
  <text x="195" y="509" font-family="Arial" font-size="18" font-weight="bold" fill="#1a1a2e" text-anchor="middle">Docker</text>

  <!-- Pill 2: Amazon ECR (orange) -->
  <rect x="330" y="470" width="150" height="64" rx="14" fill="#fff4e0" stroke="#e08e0b" stroke-width="2.5"/>
  <text x="405" y="509" font-family="Arial" font-size="17" font-weight="bold" fill="#1a1a2e" text-anchor="middle">Amazon ECR</text>

  <!-- Pill 3: Amazon EKS (green) -->
  <rect x="540" y="470" width="150" height="64" rx="14" fill="#eef8ef" stroke="#4b8c5a" stroke-width="2.5"/>
  <text x="615" y="509" font-family="Arial" font-size="17" font-weight="bold" fill="#1a1a2e" text-anchor="middle">Amazon EKS</text>

  <!-- Pill 4: LoadBalancer (orange) -->
  <rect x="750" y="470" width="150" height="64" rx="14" fill="#fff4e0" stroke="#e08e0b" stroke-width="2.5"/>
  <text x="825" y="509" font-family="Arial" font-size="16" font-weight="bold" fill="#1a1a2e" text-anchor="middle">LoadBalancer</text>

  <!-- Pill 5: DynamoDB (orange) -->
  <rect x="960" y="470" width="150" height="64" rx="14" fill="#fff4e0" stroke="#e08e0b" stroke-width="2.5"/>
  <text x="1035" y="509" font-family="Arial" font-size="17" font-weight="bold" fill="#1a1a2e" text-anchor="middle">DynamoDB</text>

  <!-- Arrows between pills -->
  <line x1="272" y1="502" x2="326" y2="502" stroke="#5b6472" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="482" y1="502" x2="536" y2="502" stroke="#5b6472" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="692" y1="502" x2="746" y2="502" stroke="#5b6472" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="902" y1="502" x2="956" y2="502" stroke="#5b6472" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Footer -->
  <line x1="48" y1="684" x2="1232" y2="684" stroke="#d9dee8" stroke-width="1"/>
  <text x="48" y="706" font-family="Arial" font-size="13" fill="#6b7280">CloudCart — Kubernetes &amp; Amazon EKS Workshop</text>
  <text x="1232" y="706" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="end">1 / 8</text>
</svg>
