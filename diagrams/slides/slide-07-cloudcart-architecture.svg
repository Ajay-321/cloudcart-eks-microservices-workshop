<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5b6472"/>
    </marker>
  </defs>

  <!-- Slide background -->
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="1280" height="90" fill="#0f1b3d"/>
  <text x="48" y="56" font-family="Arial" font-size="30" font-weight="bold" fill="#ffffff">CloudCart on EKS — the full picture</text>
  <text x="1232" y="54" font-family="Arial" font-size="16" fill="#9fb3d1" text-anchor="end">CloudCart Workshop</text>

  <!-- Browser -->
  <rect x="48" y="140" width="150" height="70" rx="14" fill="#ffffff" stroke="#c7ced9" stroke-width="2.5"/>
  <text x="123" y="182" font-family="Arial" font-size="17" font-weight="bold" fill="#1a1a2e" text-anchor="middle">Browser</text>

  <!-- AWS Load Balancer -->
  <rect x="248" y="140" width="200" height="70" rx="14" fill="#fff4e0" stroke="#e08e0b" stroke-width="2.5"/>
  <text x="348" y="175" font-family="Arial" font-size="15" font-weight="bold" fill="#1a1a2e" text-anchor="middle">AWS Load Balancer</text>
  <text x="348" y="196" font-family="Arial" font-size="13" fill="#5b6472" text-anchor="middle">(port 80)</text>

  <!-- Service: frontend -->
  <rect x="498" y="140" width="220" height="70" rx="14" fill="#e8effd" stroke="#326ce5" stroke-width="2.5"/>
  <text x="608" y="175" font-family="Arial" font-size="15" font-weight="bold" fill="#1a1a2e" text-anchor="middle">Service: frontend</text>
  <text x="608" y="196" font-family="Arial" font-size="13" fill="#5b6472" text-anchor="middle">(LoadBalancer)</text>

  <!-- frontend Pods -->
  <rect x="768" y="140" width="180" height="70" rx="14" fill="#eef8ef" stroke="#4b8c5a" stroke-width="2.5"/>
  <text x="858" y="182" font-family="Arial" font-size="16" font-weight="bold" fill="#1a1a2e" text-anchor="middle">frontend Pods</text>

  <!-- Top row arrows -->
  <line x1="200" y1="175" x2="244" y2="175" stroke="#5b6472" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="175" x2="494" y2="175" stroke="#5b6472" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="720" y1="175" x2="764" y2="175" stroke="#5b6472" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Arrow down from frontend Pods to backend group -->
  <line x1="620" y1="210" x2="620" y2="290" stroke="#5b6472" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="635" y="255" font-family="Arial" font-size="15" fill="#5b6472">/api</text>

  <!-- Backend Services group -->
  <rect x="120" y="295" width="700" height="180" rx="16" fill="#e8effd" stroke="#326ce5" stroke-width="2.5"/>
  <text x="470" y="328" font-family="Arial" font-size="18" font-weight="bold" fill="#0f1b3d" text-anchor="middle">Backend Services (ClusterIP)</text>

  <!-- Backend service chips -->
  <rect x="150" y="350" width="140" height="50" rx="10" fill="#ffffff" stroke="#c7ced9" stroke-width="2"/>
  <text x="220" y="381" font-family="Arial" font-size="15" font-weight="bold" fill="#1a1a2e" text-anchor="middle">product</text>

  <rect x="310" y="350" width="140" height="50" rx="10" fill="#ffffff" stroke="#c7ced9" stroke-width="2"/>
  <text x="380" y="381" font-family="Arial" font-size="15" font-weight="bold" fill="#1a1a2e" text-anchor="middle">inventory</text>

  <rect x="470" y="350" width="140" height="50" rx="10" fill="#ffffff" stroke="#c7ced9" stroke-width="2"/>
  <text x="540" y="381" font-family="Arial" font-size="15" font-weight="bold" fill="#1a1a2e" text-anchor="middle">cart</text>

  <rect x="630" y="350" width="140" height="50" rx="10" fill="#ffffff" stroke="#c7ced9" stroke-width="2"/>
  <text x="700" y="381" font-family="Arial" font-size="15" font-weight="bold" fill="#1a1a2e" text-anchor="middle">order</text>

  <rect x="230" y="410" width="140" height="50" rx="10" fill="#ffffff" stroke="#c7ced9" stroke-width="2"/>
  <text x="300" y="441" font-family="Arial" font-size="15" font-weight="bold" fill="#1a1a2e" text-anchor="middle">payment</text>

  <rect x="470" y="410" width="140" height="50" rx="10" fill="#ffffff" stroke="#c7ced9" stroke-width="2"/>
  <text x="540" y="441" font-family="Arial" font-size="15" font-weight="bold" fill="#1a1a2e" text-anchor="middle">auth</text>

  <!-- order -> inventory mini arrow -->
  <line x1="670" y1="400" x2="420" y2="352" stroke="#4b8c5a" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- order -> payment mini arrow -->
  <line x1="670" y1="400" x2="340" y2="408" stroke="#4b8c5a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Right: Amazon ECR -->
  <rect x="1000" y="140" width="220" height="70" rx="14" fill="#fff4e0" stroke="#e08e0b" stroke-width="2.5"/>
  <text x="1110" y="182" font-family="Arial" font-size="16" font-weight="bold" fill="#1a1a2e" text-anchor="middle">Amazon ECR</text>

  <!-- ECR -> pods pull images -->
  <line x1="1000" y1="240" x2="900" y2="300" stroke="#5b6472" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1010" y="255" font-family="Arial" font-size="14" fill="#5b6472">pull images</text>

  <!-- Amazon DynamoDB -->
  <rect x="1000" y="350" width="220" height="90" rx="14" fill="#fff4e0" stroke="#e08e0b" stroke-width="2.5"/>
  <text x="1110" y="388" font-family="Arial" font-size="16" font-weight="bold" fill="#1a1a2e" text-anchor="middle">Amazon DynamoDB</text>
  <text x="1110" y="412" font-family="Arial" font-size="13" fill="#5b6472" text-anchor="middle">(6 tables)</text>

  <!-- pods -> DynamoDB -->
  <line x1="820" y1="395" x2="996" y2="395" stroke="#5b6472" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="905" y="382" font-family="Arial" font-size="13" fill="#5b6472" text-anchor="middle">via Pod Identity</text>
  <text x="905" y="428" font-family="Arial" font-size="13" fill="#5b6472" text-anchor="middle">(no keys)</text>

  <!-- Caption -->
  <text x="640" y="560" font-family="Arial" font-size="17" font-style="italic" fill="#5b6472" text-anchor="middle">Public frontend via LoadBalancer; internal backends via ClusterIP; state in DynamoDB via Pod Identity.</text>

  <!-- Footer -->
  <line x1="48" y1="684" x2="1232" y2="684" stroke="#d9dee8" stroke-width="1"/>
  <text x="48" y="706" font-family="Arial" font-size="13" fill="#6b7280">CloudCart — Kubernetes &amp; Amazon EKS Workshop</text>
  <text x="1232" y="706" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="end">7 / 8</text>
</svg>
