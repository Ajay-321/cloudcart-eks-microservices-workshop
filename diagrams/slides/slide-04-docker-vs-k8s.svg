<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5b6472"/>
    </marker>
  </defs>

  <!-- Slide background -->
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="1280" height="90" fill="#0f1b3d"/>
  <text x="48" y="56" font-family="Arial" font-size="30" font-weight="bold" fill="#ffffff">Docker vs Kubernetes — what each one does</text>
  <text x="1232" y="54" font-family="Arial" font-size="16" fill="#9fb3d1" text-anchor="end">CloudCart Workshop</text>

  <!-- Table layout -->
  <!-- Left column background (neutral/white) -->
  <rect x="380" y="130" width="420" height="460" rx="14" fill="#ffffff" stroke="#c7ced9" stroke-width="2"/>
  <!-- Right column background (green-tinted) -->
  <rect x="820" y="130" width="420" height="460" rx="14" fill="#eef8ef" stroke="#4b8c5a" stroke-width="2.5"/>

  <!-- Header row -->
  <text x="200" y="175" font-family="Arial" font-size="18" font-weight="bold" fill="#5b6472" text-anchor="middle">Concern</text>
  <text x="590" y="175" font-family="Arial" font-size="20" font-weight="bold" fill="#0f1b3d" text-anchor="middle">Docker / Compose alone</text>
  <text x="1030" y="175" font-family="Arial" font-size="20" font-weight="bold" fill="#0f1b3d" text-anchor="middle">Kubernetes</text>

  <!-- Header divider -->
  <line x1="40" y1="195" x2="1240" y2="195" stroke="#d9dee8" stroke-width="1.5"/>

  <!-- Row 1: Scope -->
  <text x="200" y="250" font-family="Arial" font-size="17" font-weight="bold" fill="#1a1a2e" text-anchor="middle">Scope</text>
  <text x="590" y="250" font-family="Arial" font-size="16" fill="#1a1a2e" text-anchor="middle">One host</text>
  <text x="1030" y="250" font-family="Arial" font-size="16" fill="#1a1a2e" text-anchor="middle">Many hosts (a cluster)</text>
  <line x1="40" y1="275" x2="1240" y2="275" stroke="#eceff4" stroke-width="1"/>

  <!-- Row 2: Scaling -->
  <text x="200" y="325" font-family="Arial" font-size="17" font-weight="bold" fill="#1a1a2e" text-anchor="middle">Scaling</text>
  <text x="590" y="325" font-family="Arial" font-size="16" fill="#1a1a2e" text-anchor="middle">Manual</text>
  <text x="1030" y="325" font-family="Arial" font-size="16" fill="#1a1a2e" text-anchor="middle">Declarative (replicas), autoscaling</text>
  <line x1="40" y1="350" x2="1240" y2="350" stroke="#eceff4" stroke-width="1"/>

  <!-- Row 3: Self-healing -->
  <text x="200" y="400" font-family="Arial" font-size="17" font-weight="bold" fill="#1a1a2e" text-anchor="middle">Self-healing</text>
  <text x="590" y="400" font-family="Arial" font-size="16" fill="#1a1a2e" text-anchor="middle">None</text>
  <text x="1030" y="400" font-family="Arial" font-size="16" fill="#1a1a2e" text-anchor="middle">Restarts/reschedules automatically</text>
  <line x1="40" y1="425" x2="1240" y2="425" stroke="#eceff4" stroke-width="1"/>

  <!-- Row 4: Updates -->
  <text x="200" y="475" font-family="Arial" font-size="17" font-weight="bold" fill="#1a1a2e" text-anchor="middle">Updates</text>
  <text x="590" y="475" font-family="Arial" font-size="16" fill="#1a1a2e" text-anchor="middle">Manual, risky</text>
  <text x="1030" y="475" font-family="Arial" font-size="16" fill="#1a1a2e" text-anchor="middle">Rolling updates + rollback</text>
  <line x1="40" y1="500" x2="1240" y2="500" stroke="#eceff4" stroke-width="1"/>

  <!-- Row 5: Load balancing -->
  <text x="200" y="550" font-family="Arial" font-size="17" font-weight="bold" fill="#1a1a2e" text-anchor="middle">Load balancing</text>
  <text x="590" y="550" font-family="Arial" font-size="16" fill="#1a1a2e" text-anchor="middle">You wire it</text>
  <text x="1030" y="550" font-family="Arial" font-size="16" fill="#1a1a2e" text-anchor="middle">Services + LoadBalancer built in</text>

  <!-- Bottom banner -->
  <rect x="60" y="608" width="1160" height="54" rx="12" fill="#0f1b3d"/>
  <text x="640" y="642" font-family="Arial" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">Docker runs a container. Kubernetes orchestrates thousands — and keeps them in the state you declared.</text>

  <!-- Footer -->
  <line x1="48" y1="684" x2="1232" y2="684" stroke="#d9dee8" stroke-width="1"/>
  <text x="48" y="706" font-family="Arial" font-size="13" fill="#6b7280">CloudCart — Kubernetes &amp; Amazon EKS Workshop</text>
  <text x="1232" y="706" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="end">4 / 8</text>
</svg>
