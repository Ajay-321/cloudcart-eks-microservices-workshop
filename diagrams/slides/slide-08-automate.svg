<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5b6472"/>
    </marker>
  </defs>

  <!-- Slide background -->
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="1280" height="90" fill="#0f1b3d"/>
  <text x="48" y="56" font-family="Arial" font-size="30" font-weight="bold" fill="#ffffff">In real life — automate it (Terraform + Actions)</text>
  <text x="1232" y="54" font-family="Arial" font-size="16" fill="#9fb3d1" text-anchor="end">CloudCart Workshop</text>

  <!-- Main pipeline row -->
  <!-- Terraform (IaC) -->
  <rect x="60" y="180" width="260" height="110" rx="16" fill="#e8effd" stroke="#326ce5" stroke-width="2.5"/>
  <text x="190" y="230" font-family="Arial" font-size="20" font-weight="bold" fill="#1a1a2e" text-anchor="middle">Terraform</text>
  <text x="190" y="258" font-family="Arial" font-size="15" fill="#5b6472" text-anchor="middle">(IaC)</text>

  <!-- GitHub Actions (CI/CD) -->
  <rect x="400" y="180" width="260" height="110" rx="16" fill="#e8effd" stroke="#326ce5" stroke-width="2.5"/>
  <text x="530" y="230" font-family="Arial" font-size="19" font-weight="bold" fill="#1a1a2e" text-anchor="middle">GitHub Actions</text>
  <text x="530" y="258" font-family="Arial" font-size="15" fill="#5b6472" text-anchor="middle">(CI/CD)</text>

  <!-- AWS resources -->
  <rect x="740" y="180" width="480" height="110" rx="16" fill="#fff4e0" stroke="#e08e0b" stroke-width="2.5"/>
  <text x="980" y="222" font-family="Arial" font-size="18" font-weight="bold" fill="#1a1a2e" text-anchor="middle">AWS</text>
  <text x="980" y="252" font-family="Arial" font-size="15" fill="#1a1a2e" text-anchor="middle">VPC + EKS + ECR + DynamoDB</text>
  <text x="980" y="274" font-family="Arial" font-size="15" fill="#1a1a2e" text-anchor="middle">+ KMS + Pod Identity</text>

  <!-- Arrows in main pipeline -->
  <line x1="322" y1="235" x2="396" y2="235" stroke="#5b6472" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="662" y1="235" x2="736" y2="235" stroke="#5b6472" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- App pipeline chip strip -->
  <text x="60" y="370" font-family="Arial" font-size="18" font-weight="bold" fill="#0f1b3d">App pipeline</text>

  <rect x="60" y="390" width="230" height="70" rx="14" fill="#eef8ef" stroke="#4b8c5a" stroke-width="2.5"/>
  <text x="175" y="432" font-family="Arial" font-size="16" font-weight="bold" fill="#1a1a2e" text-anchor="middle">build &amp; push</text>

  <rect x="360" y="390" width="230" height="70" rx="14" fill="#eef8ef" stroke="#4b8c5a" stroke-width="2.5"/>
  <text x="475" y="432" font-family="Arial" font-size="16" font-weight="bold" fill="#1a1a2e" text-anchor="middle">deploy</text>

  <rect x="660" y="390" width="230" height="70" rx="14" fill="#eef8ef" stroke="#4b8c5a" stroke-width="2.5"/>
  <text x="775" y="432" font-family="Arial" font-size="16" font-weight="bold" fill="#1a1a2e" text-anchor="middle">seed</text>

  <rect x="960" y="390" width="260" height="70" rx="14" fill="#eef8ef" stroke="#4b8c5a" stroke-width="2.5"/>
  <text x="1090" y="425" font-family="Arial" font-size="14" font-weight="bold" fill="#1a1a2e" text-anchor="middle">print URL +</text>
  <text x="1090" y="445" font-family="Arial" font-size="14" font-weight="bold" fill="#1a1a2e" text-anchor="middle">open port 80</text>

  <!-- App pipeline arrows -->
  <line x1="290" y1="425" x2="356" y2="425" stroke="#5b6472" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="425" x2="656" y2="425" stroke="#5b6472" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="890" y1="425" x2="956" y2="425" stroke="#5b6472" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Bullets -->
  <text x="60" y="530" font-family="Arial" font-size="18" fill="#1a1a2e">• Manual steps = great for learning &amp; first run.</text>
  <text x="60" y="570" font-family="Arial" font-size="18" fill="#1a1a2e">• Automated = repeatable, reviewable, hands-off (what we do in production).</text>

  <!-- Caption -->
  <text x="640" y="635" font-family="Arial" font-size="17" font-style="italic" fill="#5b6472" text-anchor="middle">Learn it by hand, then let Terraform + CI/CD do it every time.</text>

  <!-- Footer -->
  <line x1="48" y1="684" x2="1232" y2="684" stroke="#d9dee8" stroke-width="1"/>
  <text x="48" y="706" font-family="Arial" font-size="13" fill="#6b7280">CloudCart — Kubernetes &amp; Amazon EKS Workshop</text>
  <text x="1232" y="706" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="end">8 / 8</text>
</svg>
