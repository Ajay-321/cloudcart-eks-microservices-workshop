<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="820" viewBox="0 0 1480 820">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1480" height="820" fill="#f7f8fc"/>

  <!-- Title -->
  <text x="740" y="52" font-family="Arial" font-size="30" font-weight="bold" fill="#1a1a2e" text-anchor="middle">CloudCart — 2. Inside the EKS cluster</text>

  <!-- Step badge -->
  <rect x="1270" y="26" width="170" height="44" rx="12" fill="#ffffff" stroke="#4b8c5a" stroke-width="2"/>
  <text x="1355" y="55" font-family="Arial" font-size="18" font-weight="bold" fill="#4b8c5a" text-anchor="middle">Step 2 of 4</text>

  <!-- AWS container -->
  <rect x="60" y="90" width="1360" height="600" rx="24" fill="#fff4e0" stroke="#e08e0b" stroke-width="3"/>
  <text x="90" y="128" font-family="Arial" font-size="22" font-weight="bold" fill="#e08e0b">AWS — us-east-1</text>

  <!-- VPC boundary -->
  <rect x="100" y="146" width="1280" height="520" rx="20" fill="none" stroke="#e08e0b" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="128" y="176" font-family="Arial" font-size="20" font-weight="bold" fill="#e08e0b">VPC</text>

  <!-- EKS Cluster -->
  <rect x="140" y="192" width="1200" height="452" rx="18" fill="#eef8ef" stroke="#4b8c5a" stroke-width="3"/>
  <text x="170" y="226" font-family="Arial" font-size="22" font-weight="bold" fill="#4b8c5a">Amazon EKS Cluster</text>

  <!-- Control Plane card (left half) -->
  <rect x="170" y="248" width="560" height="150" rx="16" fill="#ffffff" stroke="#4b8c5a" stroke-width="2"/>
  <text x="450" y="288" font-family="Arial" font-size="22" font-weight="bold" fill="#4b8c5a" text-anchor="middle">Control Plane (AWS-managed)</text>
  <text x="450" y="322" font-family="Arial" font-size="17" fill="#1a1a2e" text-anchor="middle">API Server • Scheduler</text>
  <text x="450" y="348" font-family="Arial" font-size="17" fill="#1a1a2e" text-anchor="middle">Controllers • etcd</text>
  <text x="450" y="380" font-family="Arial" font-size="15" font-style="italic" fill="#1a1a2e" text-anchor="middle">AWS runs &amp; upgrades this for you</text>

  <!-- Managed Node Group card (right half) -->
  <rect x="750" y="248" width="560" height="150" rx="16" fill="#ffffff" stroke="#4b8c5a" stroke-width="2"/>
  <text x="1030" y="288" font-family="Arial" font-size="22" font-weight="bold" fill="#4b8c5a" text-anchor="middle">Managed Node Group (your EC2 nodes)</text>
  <text x="1030" y="322" font-family="Arial" font-size="17" fill="#1a1a2e" text-anchor="middle">t3.medium</text>
  <text x="1030" y="348" font-family="Arial" font-size="17" fill="#1a1a2e" text-anchor="middle">min 1 • desired 2 • max 4</text>
  <text x="1030" y="380" font-family="Arial" font-size="17" fill="#1a1a2e" text-anchor="middle">Kubernetes v1.36</text>

  <!-- namespace: cloudcart box -->
  <rect x="170" y="420" width="1140" height="200" rx="16" fill="#ffffff" stroke="#4b8c5a" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="196" y="450" font-family="Arial" font-size="20" font-weight="bold" fill="#4b8c5a">namespace: cloudcart</text>

  <!-- Pods card -->
  <rect x="210" y="470" width="330" height="130" rx="14" fill="#eef8ef" stroke="#4b8c5a" stroke-width="2"/>
  <text x="375" y="512" font-family="Arial" font-size="22" font-weight="bold" fill="#4b8c5a" text-anchor="middle">Pods</text>
  <text x="375" y="552" font-family="Arial" font-size="15" font-style="italic" fill="#1a1a2e" text-anchor="middle">the running containers</text>

  <!-- Deployments card -->
  <rect x="575" y="470" width="330" height="130" rx="14" fill="#eef8ef" stroke="#4b8c5a" stroke-width="2"/>
  <text x="740" y="512" font-family="Arial" font-size="22" font-weight="bold" fill="#4b8c5a" text-anchor="middle">Deployments</text>
  <text x="740" y="552" font-family="Arial" font-size="15" font-style="italic" fill="#1a1a2e" text-anchor="middle">manage replicas + rollouts</text>

  <!-- Services card -->
  <rect x="940" y="470" width="330" height="130" rx="14" fill="#eef8ef" stroke="#4b8c5a" stroke-width="2"/>
  <text x="1105" y="512" font-family="Arial" font-size="22" font-weight="bold" fill="#4b8c5a" text-anchor="middle">Services</text>
  <text x="1105" y="552" font-family="Arial" font-size="15" font-style="italic" fill="#1a1a2e" text-anchor="middle">stable networking</text>

  <!-- Caption -->
  <text x="740" y="738" font-family="Arial" font-size="18" font-style="italic" fill="#1a1a2e" text-anchor="middle">EKS = AWS-managed Kubernetes: AWS runs the control plane, you bring the worker nodes.</text>
</svg>
